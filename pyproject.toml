[project]
name = "abetterway-converter"
version = "1.2.4"
description = "FFmpeg 8.1 Audio & Video Converter"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "flet==0.28.3",
  "flet-permission-handler",
]

[tool.flet]
org = "com.abw"
project = "converter"
product = "ABW Converter"

[tool.flet.app]
path = "src"
module = "main"
exclude = ["**/__pycache__", "**/*.pyc", "**/*.pyo"]

[tool.flet.android]
permission."android.permission.MANAGE_EXTERNAL_STORAGE" = true
permission."android.permission.READ_EXTERNAL_STORAGE" = true
permission."android.permission.WRITE_EXTERNAL_STORAGE" = true
