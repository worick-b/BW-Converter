readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "flet==0.28.3",
  "certifi",
]

[tool.flet]
org = "com.abw.converter"
product = "ABW-Converter"

[tool.flet.app]
path = "src"
module = "main"
