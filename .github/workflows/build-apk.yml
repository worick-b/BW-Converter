name: Build & Release ABW-Converter APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Gerar APKs base com Flet
        run: |
          flet build apk --arch arm64-v8a --arch armeabi-v7a --split-per-abi --compile-app --compile-packages --yes

      - name: Ativar extractNativeLibs e injetar FFmpeg 8.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R xonev8/FFmpeg-Android-HEAAC -p "*arm64-v8a*.zip" -O v8.zip
          gh release download -R xonev8/FFmpeg-Android-HEAAC -p "*armeabi-v7a*.zip" -O v7.zip

          mkdir -p inj_v8/lib/arm64-v8a inj_v7/lib/armeabi-v7a
          unzip -j -o v8.zip "libffmpeg_bin.so" -d inj_v8/lib/arm64-v8a/
          unzip -j -o v7.zip "libffmpeg_bin.so" -d inj_v7/lib/armeabi-v7a/

          BUILD_TOOLS=$(ls -d /usr/local/lib/android/sdk/build-tools/* | sort -V | tail -n 1)
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=ABW,O=ABW,C=BR"

          for apk in build/apk/*arm64-v8a*.apk; do
            (cd inj_v8 && zip -0 -r "$OLDPWD/$apk" lib/)
            "$BUILD_TOOLS/zipalign" -f -p 4 "$apk" "${apk}.aligned"
            "$BUILD_TOOLS/apksigner" sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out "$apk" "${apk}.aligned"
            rm -f "${apk}.aligned"
          done

          for apk in build/apk/*armeabi-v7a*.apk; do
            (cd inj_v7 && zip -0 -r "$OLDPWD/$apk" lib/)
            "$BUILD_TOOLS/zipalign" -f -p 4 "$apk" "${apk}.aligned"
            "$BUILD_TOOLS/apksigner" sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out "$apk" "${apk}.aligned"
            rm -f "${apk}.aligned"
          done

      - name: Publicar APKs na aba Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3
          name: ABW-Converter v1.0.3 (Android)
          files: build/apk/*.apk
