name: Build & Release ABW-Converter APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Gerar APKs com FFmpeg 8.1 nativo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flet build apk --arch arm64-v8a --arch armeabi-v7a --split-per-abi --compile-app --compile-packages --yes

          gh release download -R xonev8/FFmpeg-Android-HEAAC -p "*arm64-v8a*.zip" -O v8.zip
          gh release download -R xonev8/FFmpeg-Android-HEAAC -p "*armeabi-v7a*.zip" -O v7.zip

          mkdir -p build/flutter/android/app/src/main/jniLibs/arm64-v8a
          mkdir -p build/flutter/android/app/src/main/jniLibs/armeabi-v7a
          unzip -j -o v8.zip "libffmpeg_bin.so" -d build/flutter/android/app/src/main/jniLibs/arm64-v8a/
          unzip -j -o v7.zip "libffmpeg_bin.so" -d build/flutter/android/app/src/main/jniLibs/armeabi-v7a/

          sed -i 's/<application/<application android:extractNativeLibs="true"/g' build/flutter/android/app/src/main/AndroidManifest.xml

          FLUTTER_BIN=$(find / -name "flutter" -type f -executable 2>/dev/null | head -n 1)
          cd build/flutter && "$FLUTTER_BIN" build apk --release --split-per-abi

          rm -f "$GITHUB_WORKSPACE/build/apk/"*.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "$GITHUB_WORKSPACE/build/apk/abetterway-converter-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "$GITHUB_WORKSPACE/build/apk/abetterway-converter-armeabi-v7a.apk"

      - name: Publicar APKs na aba Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.5
          name: ABW-Converter v1.0.5 (Android)
          files: build/apk/*.apk
