name: Build & Release ABW-Converter APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Preparar projeto Android com Flet e injetar FFmpeg 8.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flet build apk --arch arm64-v8a --arch armeabi-v7a --split-per-abi --compile-app --compile-packages --yes

          gh release download -R xonev8/FFmpeg-Android-HEAAC -p "*arm64-v8a*.zip" -O v8.zip
          gh release download -R xonev8/FFmpeg-Android-HEAAC -p "*armeabi-v7a*.zip" -O v7.zip

          mkdir -p build/flutter/android/app/src/main/jniLibs/arm64-v8a
          mkdir -p build/flutter/android/app/src/main/jniLibs/armeabi-v7a
          unzip -j -o v8.zip "libffmpeg_bin.so" -d build/flutter/android/app/src/main/jniLibs/arm64-v8a/
          unzip -j -o v7.zip "libffmpeg_bin.so" -d build/flutter/android/app/src/main/jniLibs/armeabi-v7a/

          sed -i 's/<application/<application android:extractNativeLibs="true"/g' build/flutter/android/app/src/main/AndroidManifest.xml

          cd build/flutter && flutter build apk --release --split-per-abi
          cp build/app/outputs/flutter-apk/*.apk "$GITHUB_WORKSPACE/build/apk/"

          for apk in build/apk/*armeabi-v7a*.apk; do
            apktool d -r -s -f "$apk" -o tmp_apk
            sed -i 's/android:extractNativeLibs="false"/android:extractNativeLibs="true"/g' tmp_apk/AndroidManifest.xml
            mkdir -p tmp_apk/lib/armeabi-v7a
            cp inj_v7/libffmpeg_bin.so tmp_apk/lib/armeabi-v7a/
            apktool b tmp_apk -o "${apk}.unaligned"
            "$BUILD_TOOLS/zipalign" -f -p 4 "${apk}.unaligned" "$apk"
            "$BUILD_TOOLS/apksigner" sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out "$apk" "$apk"
            rm -rf tmp_apk "${apk}.unaligned"
          done

      - name: Publicar APKs na aba Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.4
          name: ABW-Converter v1.0.4 (Android)
          files: build/apk/*.apk
