name: Build & Release ABW-Converter APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Flet CLI
        run: |
          pip install --upgrade pip
          pip install flet==0.28.3

      - name: Configurar Cache do Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Gerar APKs limpos por arquitetura (arm64 e armv7)
        run: |
          mkdir -p out_apks
          flet build apk src --arch arm64-v8a --compile-app --compile-packages
          cp build/apk/*.apk out_apks/abetterway-converter-arm64-v8a.apk

          rm -rf build/apk build/flutter
          flet build apk src --arch armeabi-v7a --compile-app --compile-packages
          cp build/apk/*.apk out_apks/abetterway-converter-armeabi-v7a.apk

      - name: Ativar extractNativeLibs e injetar FFmpeg 8.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R xonev8/FFmpeg-Android-HEAAC -p "*arm64-v8a*.zip" -O v8.zip
          gh release download -R xonev8/FFmpeg-Android-HEAAC -p "*armeabi-v7a*.zip" -O v7.zip

          mkdir -p inj_v8/lib/arm64-v8a inj_v7/lib/armeabi-v7a
          unzip -j -o v8.zip "libffmpeg_bin.so" -d inj_v8/lib/arm64-v8a/
          unzip -j -o v7.zip "libffmpeg_bin.so" -d inj_v7/lib/armeabi-v7a/

          cat << 'EOF' > patch_axml.py
          import sys, struct
          data = bytearray(open(sys.argv, "rb").read())
          res_id = struct.pack("<I", 0x010104ea)
          idx = data.find(res_id)
          if idx != -1:
              pos = data.find(b"\x02\x01\x10\x00")
              while pos != -1 and pos + 36 < len(data):
                  attr_count = struct.unpack_from("<H", data, pos + 28)
                  attr_off = pos + 36
                  for i in range(attr_count):
                      entry = attr_off + i * 20
                      if entry + 20 <= len(data):
                          name_idx = struct.unpack_from("<I", data, entry + 4)
                          val_type = data[entry + 15]
                          val_data = struct.unpack_from("<I", data, entry + 16)
                          if val_type == 0x12 and val_data == 0:
                              id_pos = idx - name_idx * 4
                              if id_pos >= 0 and data[id_pos:id_pos+4] == res_id:
                                  struct.pack_into("<I", data, entry + 16, 0xFFFFFFFF)
                  pos = data.find(b"\x02\x01\x10\x00", pos + 4)
          open(sys.argv, "wb").write(data)
          EOF

          BUILD_TOOLS=$(ls -d /usr/local/lib/android/sdk/build-tools/* | sort -V | tail -n 1)
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=ABW,O=ABW,C=BR"

          for pair in "out_apks/abetterway-converter-arm64-v8a.apk:inj_v8" "out_apks/abetterway-converter-armeabi-v7a.apk:inj_v7"; do
            apk="${pair%%:*}"
            dir="${pair##*:}"
            unzip -o "$apk" AndroidManifest.xml -d "$dir/"
            python patch_axml.py "$dir/AndroidManifest.xml"
            (cd "$dir" && zip -0 -r "$OLDPWD/$apk" AndroidManifest.xml lib/)
            "$BUILD_TOOLS/zipalign" -f -p 4 "$apk" "${apk}.aligned"
            "$BUILD_TOOLS/apksigner" sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out "$apk" "${apk}.aligned"
            rm -f "${apk}.aligned" "$dir/AndroidManifest.xml"
          done

      - name: Publicar APKs na aba Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.5
          name: ABW-Converter v1.1.5
          files: out_apks/*.apk
