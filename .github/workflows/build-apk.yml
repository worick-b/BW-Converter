name: Build Native Android APK (ABW Converter)

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Baixar e instalar FFmpeg 8.1 + MKVToolNix em jniLibs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/armeabi-v7a
          mkdir -p tmp_bins/ff_v8 tmp_bins/ff_v7 tmp_bins/mkv_v8 tmp_bins/mkv_v7

          # Baixar FFmpeg 8.1 Static (repositório FFmpeg-Android, tag v8.1-android)
          gh release download v8.1-android -R xonev8/FFmpeg-Android -p "*arm64-v8a*.zip" -O tmp_bins/ff_v8.zip
          gh release download v8.1-android -R xonev8/FFmpeg-Android -p "*armeabi-v7a*.zip" -O tmp_bins/ff_v7.zip

          unzip -o tmp_bins/ff_v8.zip -d tmp_bins/ff_v8
          unzip -o tmp_bins/ff_v7.zip -d tmp_bins/ff_v7
          cp -f tmp_bins/ff_v8/libffmpeg_bin.so app/src/main/jniLibs/arm64-v8a/libffmpeg_bin.so
          cp -f tmp_bins/ff_v7/libffmpeg_bin.so app/src/main/jniLibs/armeabi-v7a/libffmpeg_bin.so

          # Baixar MKVToolNix 57.0.0 Static (repositório MKVToolNix-Android, tag v1.0-android-mkvmerge)
          gh release download v1.0-android-mkvmerge -R xonev8/MKVToolNix-Android -p "*arm64-v8a*.zip" -O tmp_bins/mkv_v8.zip
          gh release download v1.0-android-mkvmerge -R xonev8/MKVToolNix-Android -p "*armeabi-v7a*.zip" -O tmp_bins/mkv_v7.zip

          unzip -o tmp_bins/mkv_v8.zip -d tmp_bins/mkv_v8
          unzip -o tmp_bins/mkv_v7.zip -d tmp_bins/mkv_v7
          cp -f tmp_bins/mkv_v8/libmkvmerge_bin.so app/src/main/jniLibs/arm64-v8a/libmkvmerge_bin.so
          cp -f tmp_bins/mkv_v7/libmkvmerge_bin.so app/src/main/jniLibs/armeabi-v7a/libmkvmerge_bin.so

          chmod 755 app/src/main/jniLibs/*/*.so
          rm -rf tmp_bins
          ls -lh app/src/main/jniLibs/arm64-v8a/
          ls -lh app/src/main/jniLibs/armeabi-v7a/

      - name: Gerar Ícones Adaptativos do App (Pillow)
        run: |
          python3 -m pip install --quiet --break-system-packages pillow
          python3 generate_icons.py

      - name: Garantir AndroidManifest.xml válido
        run: |
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://android.com">

              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="ABW Converter"
                  android:requestLegacyExternalStorage="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Gerar Gradle Wrapper e Compilar APKs Release
        run: |
          gradle wrapper --gradle-version 8.11.1
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Publicar APKs nos Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ABW-Converter-Native-APKs
          path: app/build/outputs/apk/release/*.apk
