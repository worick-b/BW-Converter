name: Build & Release ABW-Converter APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Gerar APKs base com Flet
        run: |
          flet build apk --arch arm64-v8a --arch armeabi-v7a --split-per-abi --compile-app --compile-packages --yes

      - name: Ativar extractNativeLibs e injetar FFmpeg 8.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R xonev8/FFmpeg-Android-HEAAC -p "*arm64-v8a*.zip" -O v8.zip
          gh release download -R xonev8/FFmpeg-Android-HEAAC -p "*armeabi-v7a*.zip" -O v7.zip

          mkdir -p inj_v8/lib/arm64-v8a inj_v7/lib/armeabi-v7a
          unzip -j -o v8.zip "libffmpeg_bin.so" -d inj_v8/lib/arm64-v8a/
          unzip -j -o v7.zip "libffmpeg_bin.so" -d inj_v7/lib/armeabi-v7a/

          cat << 'EOF' > patch_axml.py
          import sys, struct
          data = bytearray(open(sys.argv[1], "rb").read())
          # ID oficial do atributo android:extractNativeLibs (0x010104ea)
          res_id = struct.pack("<I", 0x010104ea)
          idx = data.find(res_id)
          if idx != -1:
              # Avanca ate os atributos XML (cada atributo AXML tem 20 bytes)
              pos = data.find(b"\x02\x01\x10\x00")
              while pos != -1 and pos + 36 < len(data):
                  attr_count = struct.unpack_from("<H", data, pos + 28)[0]
                  attr_off = pos + 36
                  for i in range(attr_count):
                      entry = attr_off + i * 20
                      if entry + 20 <= len(data):
                          name_idx = struct.unpack_from("<I", data, entry + 4)[0]
                          val_type = data[entry + 15]
                          val_data = struct.unpack_from("<I", data, entry + 16)[0]
                          if val_type == 0x12 and val_data == 0:
                              # Verifica se o nome corresponde ao res_id
                              id_pos = idx - name_idx * 4
                              if id_pos >= 0 and data[id_pos:id_pos+4] == res_id:
                                  struct.pack_into("<I", data, entry + 16, 0xFFFFFFFF)
                                  print("extractNativeLibs alterado para TRUE!")
                  pos = data.find(b"\x02\x01\x10\x00", pos + 4)
          open(sys.argv[1], "wb").write(data)
          EOF

          BUILD_TOOLS=$(ls -d /usr/local/lib/android/sdk/build-tools/* | sort -V | tail -n 1)
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=ABW,O=ABW,C=BR"

          for apk in build/apk/*arm64-v8a*.apk; do
            unzip -o "$apk" AndroidManifest.xml -d inj_v8/
            python patch_axml.py inj_v8/AndroidManifest.xml
            (cd inj_v8 && zip -0 -r "$OLDPWD/$apk" AndroidManifest.xml lib/)
            "$BUILD_TOOLS/zipalign" -f -p 4 "$apk" "${apk}.aligned"
            "$BUILD_TOOLS/apksigner" sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out "$apk" "${apk}.aligned"
            rm -f "${apk}.aligned" inj_v8/AndroidManifest.xml
          done

          for apk in build/apk/*armeabi-v7a*.apk; do
            unzip -o "$apk" AndroidManifest.xml -d inj_v7/
            python patch_axml.py inj_v7/AndroidManifest.xml
            (cd inj_v7 && zip -0 -r "$OLDPWD/$apk" AndroidManifest.xml lib/)
            "$BUILD_TOOLS/zipalign" -f -p 4 "$apk" "${apk}.aligned"
            "$BUILD_TOOLS/apksigner" sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out "$apk" "${apk}.aligned"
            rm -f "${apk}.aligned" inj_v7/AndroidManifest.xml
          done

      - name: Publicar APKs na aba Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: ABW-Converter v1.1.0
          files: build/apk/*.apk
