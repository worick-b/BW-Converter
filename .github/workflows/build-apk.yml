name: Build & Release ABW-Converter APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Baixar FFmpeg 8.1 da última Release
        run: |
          mkdir -p src/flutter/android/app/src/main/jniLibs/arm64-v8a
          mkdir -p src/flutter/android/app/src/main/jniLibs/armeabi-v7a
          BASE="https://github.com"
          wget -q "$BASE/FFmpeg-8.1-Android-arm64-v8a-HEAAC.zip"
          wget -q "$BASE/FFmpeg-8.1-Android-armeabi-v7a-HEAAC.zip"
          unzip -j -o FFmpeg-8.1-Android-arm64-v8a-HEAAC.zip "libffmpeg_bin.so" -d src/flutter/android/app/src/main/jniLibs/arm64-v8a/
          unzip -j -o FFmpeg-8.1-Android-armeabi-v7a-HEAAC.zip "libffmpeg_bin.so" -d src/flutter/android/app/src/main/jniLibs/armeabi-v7a/

      - name: Gerar APKs (arm64-v8a e armeabi-v7a)
        run: |
          flet build apk --arch arm64-v8a --arch armeabi-v7a --split-per-abi

      - name: Disponibilizar APKs nos Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ABW-Converter-APKs
          path: build/apk/*.apk

      - name: Publicar APKs na aba Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: ABW-Converter v1.0.0
          files: build/apk/*.apk
