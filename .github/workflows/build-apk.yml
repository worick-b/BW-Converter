name: Build & Release ABW-Converter APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Extrair template local do Flet e injetar FFmpeg 8.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - << 'EOF'
          import shutil, pathlib, flet_cli
          tpl_src = next(pathlib.Path(flet_cli.__file__).resolve().parent.rglob("*template*"))
          if tpl_src.is_file():
              tpl_src = tpl_src.parent
          shutil.copytree(tpl_src, "meu_template", dirs_exist_ok=True)
          EOF

          gh release download -R xonev8/FFmpeg-Android-HEAAC -p "*arm64-v8a*.zip" -O v8.zip
          gh release download -R xonev8/FFmpeg-Android-HEAAC -p "*armeabi-v7a*.zip" -O v7.zip

          mkdir -p meu_template/android/app/src/main/jniLibs/arm64-v8a
          mkdir -p meu_template/android/app/src/main/jniLibs/armeabi-v7a
          unzip -j -o v8.zip "libffmpeg_bin.so" -d meu_template/android/app/src/main/jniLibs/arm64-v8a/
          unzip -j -o v7.zip "libffmpeg_bin.so" -d meu_template/android/app/src/main/jniLibs/armeabi-v7a/

          python - << 'EOF'
          import xml.etree.ElementTree as ET
          ns = "http://android.com"
          manifest = "meu_template/android/app/src/main/AndroidManifest.xml"
          ET.register_namespace("android", ns)
          tree = ET.parse(manifest)
          app = tree.getroot().find("application")
          app.set(f"{{{ns}}}extractNativeLibs", "true")
          tree.write(manifest, encoding="utf-8", xml_declaration=True)
          EOF

      - name: Gerar APKs finais com Flet
        run: |
          flet build apk --template "file://$GITHUB_WORKSPACE/meu_template" --arch arm64-v8a --arch armeabi-v7a --split-per-abi --compile-app --compile-packages --yes

      - name: Publicar APKs na aba Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.7
          name: ABW-Converter v1.0.7 (Android)
          files: build/apk/*.apk
